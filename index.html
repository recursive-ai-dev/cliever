<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cliever | AI Agent Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"Fira Code"', 'monospace'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              cyan: {
                400: '#22d3ee',
                500: '#06b6d4',
                900: '#164e63',
              },
              terminal: {
                black: '#0c0c0c',
                dark: '#121212',
                green: '#00ff41',
                dim: '#008f11',
              }
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scanline': 'scanline 8s linear infinite',
            },
            keyframes: {
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* CSS Variables - Default Theme (Dark with Teal) */
      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #111111;
        --bg-tertiary: #1a1a1a;
        --text-primary: #e5e5e5;
        --text-secondary: #a3a3a3;
        --text-muted: #666666;
        --accent: #14b8a6;
        --accent-hover: #2dd4bf;
        --accent-glow: rgba(20, 184, 166, 0.3);
        --success: #10b981;
        --warning: #f59e0b;
        --error: #ef4444;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(20, 184, 166, 0.4);
        --glass: rgba(17, 17, 17, 0.8);
        --scroll-track: #111111;
        --scroll-thumb: #333333;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scroll-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .glass-panel {
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
      }

      /* Theme-aware utility classes */
      .theme-bg-primary { background-color: var(--bg-primary); }
      .theme-bg-secondary { background-color: var(--bg-secondary); }
      .theme-bg-tertiary { background-color: var(--bg-tertiary); }
      .theme-text-primary { color: var(--text-primary); }
      .theme-text-secondary { color: var(--text-secondary); }
      .theme-text-muted { color: var(--text-muted); }
      .theme-accent { color: var(--accent); }
      .theme-border { border-color: var(--border); }

      /* Accent glow effect */
      .theme-glow {
        box-shadow: 0 0 20px var(--accent-glow);
      }

      /* Theme transition for smooth changes */
      * {
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      /* M4trix digital rain effect (optional, applied via JS) */
      .m4trix-rain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
        opacity: 0.03;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          var(--accent) 2px,
          var(--accent) 4px
        );
        animation: rain 0.5s linear infinite;
      }

      @keyframes rain {
        0% { transform: translateY(0); }
        100% { transform: translateY(4px); }
      }

      /* Synthwave gradient overlay (optional) */
      .synthwave-gradient {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 40%;
        pointer-events: none;
        z-index: -1;
        background: linear-gradient(
          to top,
          rgba(255, 42, 109, 0.05) 0%,
          rgba(5, 255, 161, 0.02) 50%,
          transparent 100%
        );
      }

      /* H3llscape ember effect */
      .h3llscape-embers {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 100%;
        pointer-events: none;
        z-index: -1;
        background: radial-gradient(
          ellipse at bottom,
          rgba(255, 51, 51, 0.08) 0%,
          transparent 70%
        );
      }
    </style>

}
</script>
